name: bugsafari-local

services:
  redis:
    image: redis:alpine
    container_name: bugsafari-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bugsafari-local

  api:
    container_name: bugsafari-api
    restart: unless-stopped
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.60.0-noble
        WORKDIR /app
        ENV NODE_ENV=development
        COPY package.json package-lock.json ./
        COPY testing-core/package.json ./testing-core/package.json
        COPY shared/package.json ./shared/package.json
        RUN npm ci --workspace testing-core --include-workspace-root
        COPY testing-core ./testing-core
        COPY shared ./shared
        RUN npm run build --workspace shared
        RUN npm run build --workspace testing-core
        EXPOSE 3000
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=development
      # Hosting mode for target-URL routing; DOCKER_LOCAL bridges loopback to the host.
      - RUN_ENVIRONMENT=${RUN_ENVIRONMENT:-DOCKER_LOCAL}
      - PORT=3000
      - BUGSAFARI_PORT=3000
      - BUGSAFARI_API_PORT=3000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=bugsafari-local-development-secret
      - JWT_EXPIRES_IN=7d
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - APP_NAME=BugSafari
    ports:
      - "3000:3000"
    # Resolve host.docker.internal to the host gateway so a loopback target URL
    # (localhost/127.0.0.1) rewritten by the engine reaches the operator's host app.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Live source mount: the image bakes a build-time copy of the source, so code
    # changes never reached the container. Mounting the host source over the baked
    # copy makes tsc-watch (npm run dev) recompile the *current* code on start and
    # on every edit — no image rebuild needed.
    volumes:
      - ./testing-core/src:/app/testing-core/src
      # Keep shared contracts in sync with the live testing-core mount so tsc-watch
      # compiles against current types (stale baked shared breaks the compile → no server).
      - ./shared:/app/shared
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bugsafari-local
    command: >
      sh -c "npm run dev --workspace testing-core"


  worker:
    container_name: bugsafari-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.60.0-noble
        WORKDIR /app
        ENV NODE_ENV=development
        COPY package.json package-lock.json ./
        COPY testing-core/package.json ./testing-core/package.json
        COPY shared/package.json ./shared/package.json
        RUN npm ci --workspace testing-core --include-workspace-root
        COPY testing-core ./testing-core
        COPY shared ./shared
        RUN npm run build --workspace shared
        RUN npm run build --workspace testing-core
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=development
      # Hosting mode for target-URL routing; DOCKER_LOCAL bridges loopback to the host.
      - RUN_ENVIRONMENT=${RUN_ENVIRONMENT:-DOCKER_LOCAL}
      - REDIS_URL=redis://redis:6379
      - BUGSAFARI_WORKER_CONCURRENCY=1
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    # Same host-gateway mapping as the api service: queued jobs run Playwright here,
    # so the worker must also resolve host.docker.internal to reach a loopback target.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Live source mount (same rationale as the api service) so queued-job runs use
    # current code and stamp sessions with the real userId.
    volumes:
      - ./testing-core/src:/app/testing-core/src
      # Same shared mount as api: worker also runs tsc-watch and must compile against
      # the current shared contracts, not the stale copy baked into the image.
      - ./shared:/app/shared
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bugsafari-local
    command: >
      sh -c "npm run dev --workspace testing-core"

volumes:
  redis-data:
    name: bugsafari-redis-data

networks:
  bugsafari-local:
    name: bugsafari-local
    driver: bridge
