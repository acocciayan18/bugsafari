name: bugsafari-local

services:
  redis:
    image: redis:alpine
    container_name: bugsafari-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bugsafari-local

  api:
    container_name: bugsafari-api
    restart: unless-stopped
    build:
      context: .
      # Real file, not dockerfile_inline: podman's compose ignores inline and would
      # otherwise build the production Dockerfile (which prunes dev deps and breaks
      # tsc-watch). See Dockerfile.dev.
      dockerfile: Dockerfile.dev
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=development
      - PORT=3000
      - BUGSAFARI_PORT=3000
      - BUGSAFARI_API_PORT=3000
      - REDIS_URL=redis://redis:6379
      # Route /api/start-test through the Redis queue to the worker fleet instead
      # of running Playwright in-process (prevents API-process memory exhaustion).
      - BUGSAFARI_USE_QUEUE=1
      # Same value as the worker below (sourced from root .env) so the worker can
      # decrypt target credentials the api sealed. Enables authenticated queued runs.
      - BUGSAFARI_AUTH_KEY=${BUGSAFARI_AUTH_KEY}
      - JWT_SECRET=bugsafari-local-development-secret
      - JWT_EXPIRES_IN=7d
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - APP_NAME=BugSafari
      # On-demand AI Suggested Fix (POST /api/findings/suggest-fix). Empty => the
      # endpoint returns the deterministic knowledge-base advice as fallback.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
    ports:
      - "3000:3000"
    # Live source mount: the image bakes a build-time copy of the source, so code
    # changes never reached the container. Mounting the host source over the baked
    # copy makes tsc-watch (npm run dev) recompile the *current* code on start and
    # on every edit — no image rebuild needed. `shared/` is mounted for the same
    # reason: its .ts contracts are compiled into dist/ by testing-core's tsc-watch,
    # so shared changes hot-recompile too instead of going stale against the image.
    volumes:
      - ./testing-core/src:/app/testing-core/src
      - ./shared:/app/shared
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bugsafari-local
    command: >
      sh -c "npm run dev --workspace testing-core"


  worker:
    # No container_name: a fixed name pins the service to exactly one container and
    # makes `--scale` / replicas fail. Containers are named bugsafari-local-worker-N.
    restart: unless-stopped
    # Fleet capacity == replica count. Each replica is its own process + Chromium +
    # forensic buffers, so concurrent runs are isolated by the OS rather than by
    # convention (in-process concurrency stays clamped to 1 — see SafariWorker.ts).
    # Budget ~700MB per replica. Override: WORKER_REPLICAS=3, or
    # `podman compose -f docker-compose.local.yml up --scale worker=3`.
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    build:
      context: .
      # Real file, not dockerfile_inline (podman ignores inline → prod Dockerfile →
      # dev deps pruned → tsc-watch missing). See Dockerfile.dev.
      dockerfile: Dockerfile.dev
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      # Must match the api's key (root .env) — the worker decrypts credentials the
      # api sealed into the AuthVault for this run.
      - BUGSAFARI_AUTH_KEY=${BUGSAFARI_AUTH_KEY}
      - BUGSAFARI_WORKER_CONCURRENCY=1
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    # Live source mount (same rationale as the api service) so queued-job runs use
    # current code and stamp sessions with the real userId. `shared/` is mounted too
    # so shared contract changes hot-recompile instead of going stale against the image.
    volumes:
      - ./testing-core/src:/app/testing-core/src
      - ./shared:/app/shared
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bugsafari-local
    command: >
      sh -c "npm run dev:worker --workspace testing-core"

  # Opt-in benchmark target. Not started by default; bring it up with
  # `docker compose -f docker-compose.local.yml --profile target up target-app`.
  # The engine's SSRF guard rejects localhost, so expose it via `npm run tunnel`
  # on the host (cloudflared) and paste the public URL into the start-test form.
  target-app:
    container_name: bugsafari-target-app
    profiles:
      - target
    restart: unless-stopped
    build:
      context: ./bugsafari-target-app
      dockerfile: docker/Dockerfile
    ports:
      - "5174:5174"
    networks:
      - bugsafari-local

volumes:
  redis-data:
    name: bugsafari-redis-data

networks:
  bugsafari-local:
    name: bugsafari-local
    driver: bridge
