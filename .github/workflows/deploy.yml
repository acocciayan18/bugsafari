name: Deploy BugSafari to DigitalOcean

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Native SSH Key
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$DROPLET_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

      - name: Execute Remote Deploy Commands
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.DROPLET_HOST }} << 'EOF'
            cd /var/www/bugsafari
            git fetch origin dev
            git checkout dev
            git pull origin dev
            docker compose -f docker-compose.prod.yml up -d --build
          EOF