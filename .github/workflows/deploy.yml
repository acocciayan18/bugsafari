name: Deploy to DigitalOcean

on:
  push:
    branches:
      - dev  # Change to the branch you want to listen to (e.g., main or dev)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /var/www/bugsafari
            git fetch origin
            git checkout dev
            git pull origin dev
            docker compose -f docker-compose.prod.yml up -d --build