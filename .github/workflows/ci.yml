name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend:
    name: testing-core + shared
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build --workspace shared --if-present
      - name: Typecheck
        run: npm run typecheck --workspace testing-core
      - name: Lint
        run: npm run lint
      - name: Unit tests (shared)
        run: npm test --workspace shared --if-present
      - name: Unit tests (testing-core)
        run: npm test --workspace testing-core

  frontend:
    name: developer-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build --workspace shared --if-present
      # The dashboard has no separate typecheck script — its build IS the typecheck
      # (vite + tsc), which is how the root `typecheck` script treats it too.
      - name: Build (typecheck)
        run: npm run build --workspace developer-dashboard
      - name: Unit tests (developer-dashboard)
        run: npm test --workspace developer-dashboard
