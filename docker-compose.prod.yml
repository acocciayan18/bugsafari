name: bugsafari-prod

x-shared-env: &shared-env
  NODE_ENV: production
  MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
  REDIS_URL: redis://redis:6379
  BUGSAFARI_AUTH_KEY: ${BUGSAFARI_AUTH_KEY:?set BUGSAFARI_AUTH_KEY (32-byte hex or base64)}
  FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
  # Operator emails (password reset, email verification). Consumed by the api service
  # (the only sender). PRIMARY transport is the Brevo HTTP API over 443 — set when the
  # host blocks outbound SMTP (GCP and others block 25/465/587), which makes the SMTP
  # path time out. Use the Brevo v3 API key (xkeysib-…), NOT the SMTP key (xsmtpsib-…).
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  # SMTP fallback for hosts that permit it. SMTP_PASS is the provider's SMTP key; unset
  # (and no BREVO_API_KEY) => sends fail and signup/reset return a structured error.
  # Port 587 = STARTTLS (SMTP_SECURE=false); 465 = implicit TLS (SMTP_SECURE=true).
  SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-resend}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  APP_NAME: ${APP_NAME:-BugSafari}
  # Configurable link lifetimes (ms). Reset default 1h, verification default 24h.
  RESET_TOKEN_TTL_MS: ${RESET_TOKEN_TTL_MS:-3600000}
  EMAIL_VERIFICATION_TTL_MS: ${EMAIL_VERIFICATION_TTL_MS:-86400000}
  # API rate limiting. Emergency kill switch (default off). Per-limiter overrides
  # (BUGSAFARI_RL_<LIMITER>_MAX / _WINDOW_MS) can be added here as needed; see
  # testing-core/.env.example for the limiter list and defaults.
  BUGSAFARI_RL_DISABLED: ${BUGSAFARI_RL_DISABLED:-false}
  RUN_ENVIRONMENT: ${RUN_ENVIRONMENT:-CLOUD_HOSTED}
  # One reverse proxy (Caddy) sits in front, so req.ip must read the single
  # X-Forwarded-For hop it appends. Unset (0) collapses every client into the
  # proxy's IP for rate limiting; a blanket trust would let a client forge it (SEC-16).
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  # AI remediation / insights. Optional by design — an empty key makes the endpoints
  # return the deterministic knowledge-base advice instead of failing the UI.
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
  GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-30000}
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  # NODE_OPTIONS is set PER SERVICE, not here: a heap ceiling equal to the cgroup
  # limit OOM-kills before V8 ever runs a major GC, and a worker's cgroup must hold
  # Node AND Chromium. See the api/worker service blocks for the right-sized values.
  # Bound the queue backlog: 2 slots × 600s timebox ⇒ 20 deep is ~100 min, the edge
  # of a wait time the UI can honestly display. Beyond that the enqueue returns 503.
  BUGSAFARI_MAX_QUEUE_DEPTH: ${BUGSAFARI_MAX_QUEUE_DEPTH:-20}
  # Live-feed retune for a 2 vCPU box (monitoring feed, not a recording): ~10 fps is
  # smooth for watching an agent at a third of the encode/bandwidth cost. Observability
  # only — the engine's own perception (viewport) is unchanged. Override to revert.
  BUGSAFARI_SCREENCAST_MAX_FPS: ${BUGSAFARI_SCREENCAST_MAX_FPS:-10}
  BUGSAFARI_SCREENCAST_QUALITY: ${BUGSAFARI_SCREENCAST_QUALITY:-30}
  BUGSAFARI_SCREENCAST_MAX_WIDTH: ${BUGSAFARI_SCREENCAST_MAX_WIDTH:-960}
  BUGSAFARI_SCREENCAST_MAX_HEIGHT: ${BUGSAFARI_SCREENCAST_MAX_HEIGHT:-600}
  # Freeze-detector timeout (ms). A worker capped at 0.6 vCPU can legitimately block
  # the renderer for several seconds on a heavy in-page parse, tripping a false client
  # render freeze against the 5s default; widen it here so only a genuine lock-up fires.
  BUGSAFARI_FREEZE_TIMEOUT_MS: ${BUGSAFARI_FREEZE_TIMEOUT_MS:-8000}
  # Adaptive per-run memory budget (resourceProbe.ts). RESERVE_SYSTEM_MB is OS + burst
  # headroom above resident (NOT the api/redis/caddy ceilings — host-free already
  # excludes what they hold). PER_WORKER_FLOOR_MB is reserved for each OTHER active
  # worker. SAFETY_RATIO scales the host-aware budget (never the cgroup ceiling).
  # DEGRADE_RATIO sheds load before the 0.85 abort ratio. HOST_FREE_FLOOR_MB is the
  # hard host-pressure override that fires ahead of the kernel OOM killer.
  BUGSAFARI_MEM_RESERVE_SYSTEM_MB: ${BUGSAFARI_MEM_RESERVE_SYSTEM_MB:-500}
  BUGSAFARI_MEM_PER_WORKER_FLOOR_MB: ${BUGSAFARI_MEM_PER_WORKER_FLOOR_MB:-900}
  BUGSAFARI_MEM_SAFETY_RATIO: ${BUGSAFARI_MEM_SAFETY_RATIO:-0.9}
  BUGSAFARI_MEM_DEGRADE_RATIO: ${BUGSAFARI_MEM_DEGRADE_RATIO:-0.75}
  BUGSAFARI_MEM_HOST_FREE_FLOOR_MB: ${BUGSAFARI_MEM_HOST_FREE_FLOOR_MB:-350}
  # Engine liveness. The worker stamps a heartbeat every ~3s regardless of activity; past
  # STALE_MS with no stamp the api reports the run STALLED to its dashboard so a wedged
  # worker stops reading as healthy. The run is never auto-terminated — the timebox
  # remains the only automatic terminator. Raise STALE_MS if 0.6-vCPU workers under a
  # Chromium burst are being reported stalled while genuinely alive.
  BUGSAFARI_ENGINE_STALE_MS: ${BUGSAFARI_ENGINE_STALE_MS:-45000}
  BUGSAFARI_ENGINE_HEALTH_SWEEP_MS: ${BUGSAFARI_ENGINE_HEALTH_SWEEP_MS:-15000}
  # Durable finding checkpoint: the engine flushes its ledger to the run's session doc
  # mid-run, so a refresh / dropped socket / OOM-killed worker cannot lose findings the
  # backend already confirmed. Dirty-gated, so a quiet run costs no writes.
  BUGSAFARI_FINDING_CHECKPOINT_MS: ${BUGSAFARI_FINDING_CHECKPOINT_MS:-10000}
  BUGSAFARI_FINDING_CHECKPOINT_THRESHOLD: ${BUGSAFARI_FINDING_CHECKPOINT_THRESHOLD:-5}
  # Media routing (mediaRoute.ts): abort heavy sub-resources to cut Chromium memory.
  # Images preserved. Set BUGSAFARI_MEDIA_ROUTE=0 to disable; edit the CSV to add types
  # (e.g. media,font,image) to trade image fidelity for headroom on huge image sites.
  BUGSAFARI_MEDIA_ROUTE: ${BUGSAFARI_MEDIA_ROUTE:-1}
  BUGSAFARI_MEDIA_ROUTE_BLOCK_TYPES: ${BUGSAFARI_MEDIA_ROUTE_BLOCK_TYPES:-media,font}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:alpine
    container_name: bugsafari-prod-redis
    restart: unless-stopped
    # Fail predictably instead of being OOM-killed: a write refusal surfaces as a
    # visible enqueue error, an eviction would silently vanish a live run's job.
    # --save "" disables RDB snapshotting (no durable business data lives here) and
    # its fork-driven memory spikes.
    command: ["redis-server", "--maxmemory", "160mb", "--maxmemory-policy", "noeviction", "--save", ""]
    logging: *default-logging
    networks:
      - bugsafari-prod
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "0.15"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    container_name: bugsafari-prod-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *shared-env
      PORT: 3000
      # Enqueue /api/start-test to the worker fleet instead of running Chromium in
      # the api process. Workers do not read this — the api is the only producer.
      BUGSAFARI_USE_QUEUE: "1"
      # No Chromium in the api after queueing; heap is ~2/3 of the 768MB cgroup,
      # leaving room for socket buffers and frame payloads.
      NODE_OPTIONS: "--max-old-space-size=512"
    command: ["npm", "run", "start", "--workspace", "testing-core"]
    ports:
      - "0.0.0.0:3000:3000"
    logging: *default-logging
    networks:
      - bugsafari-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.6"
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:latest
    container_name: bugsafari-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bugsafari-prod
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *shared-env
      BUGSAFARI_WORKER_CONCURRENCY: ${BUGSAFARI_WORKER_CONCURRENCY:-1}
      # The cgroup holds Node AND Chromium (400-600MB RSS), so the Node heap is a
      # deliberate minority of it — a 1GB heap ceiling here would guarantee mid-run
      # OOM-kills, which BullMQ surfaces as a stalled/failed job and a lost run.
      # --expose-gc lets the adaptive memory watchdog's degrade tier reclaim heap
      # before it must abort a run under pressure.
      NODE_OPTIONS: "--max-old-space-size=384 --expose-gc"
    command: ["npm", "run", "start:worker", "--workspace", "testing-core"]
    logging: *default-logging
    networks:
      - bugsafari-prod
    deploy:
      # 2 Worker Replicas == 2 Parallel Test Jobs (Ideal for 2 vCPU / 4GB RAM)
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          # HARD physical backstop only, configurable via WORKER_MEM_LIMIT (1600m/2600m/3600m).
          # The adaptive memory watchdog (resourceProbe.ts) reads this cgroup limit and sizes
          # each run's real budget from live host-free memory minus reserved pools, so a lone
          # run on an idle box may climb toward this ceiling while two busy workers each abort
          # well below it. At the 2600m default with WORKER_REPLICAS=2 a 4GB box is heavily
          # over-committed on paper (2600x2 + api 768 + redis 192 + caddy 256 = 6416 > 4096),
          # but limits are ceilings not reservations, and the watchdog + HOST_FREE_FLOOR + peer
          # reservation prevent both workers realizing their ceilings at once. For heavy targets,
          # give a lone run the full ceiling by raising host RAM or setting WORKER_REPLICAS=1.
          # Node heap stays 384MB (line above) — the extra GB is for Chromium, not Node.
          memory: ${WORKER_MEM_LIMIT:-2600m}
          # Under-provisioned vs 1.0 on purpose so a Chromium burst never starves
          # the api event loop (control latency is operator-visible; exploration is
          # a background batch workload where a small slowdown is invisible).
          cpus: "0.6"
    depends_on:
      redis:
        condition: service_healthy

networks:
  bugsafari-prod:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: