name: bugsafari-prod

# Production topology: API + worker fleet + Redis, all built from the single root
# Dockerfile (no inline dockerfile divergence — see B3). Secrets are injected from
# the host environment; nothing is hardcoded. Requires MONGODB_URI and JWT_SECRET to
# be exported (the API hard-fails on boot without JWT_SECRET in production).


x-shared-env: &shared-env
  NODE_ENV: production
  MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
  REDIS_URL: redis://redis:6379
  # Shared by api + worker (single anchor guarantees an identical key across processes)
  # so the worker can decrypt target credentials the api sealed. Required for
  # authenticated queued runs; the api refuses them without it (AUTH_UNSUPPORTED_ON_QUEUE).
  BUGSAFARI_AUTH_KEY: ${BUGSAFARI_AUTH_KEY:?set BUGSAFARI_AUTH_KEY (32-byte hex or base64)}
  RUN_ENVIRONMENT: ${RUN_ENVIRONMENT:-CLOUD}
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  # TTL is always on; keep the cascade reaper on so expired sessions don't orphan
  # forensic children (DB3).
  BUGSAFARI_ENABLE_RETENTION_REAPER: "true"

services:
  redis:
    image: redis:alpine
    container_name: bugsafari-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bugsafari-prod

  api:
    container_name: bugsafari-prod-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *shared-env
      # Route start-test through Redis to the worker fleet — mandatory for prod
      # so the API process never launches Playwright in-process (SC2).
      BUGSAFARI_USE_QUEUE: "1"
      # Backlog ceiling; enqueue past this returns 503 QUEUE_FULL.
      BUGSAFARI_MAX_QUEUE_DEPTH: ${BUGSAFARI_MAX_QUEUE_DEPTH:-50}
      BUGSAFARI_PORT: "3000"
      BUGSAFARI_API_PORT: "3000"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      APP_NAME: ${APP_NAME:-BugSafari}
      # On-demand AI Suggested Fix; empty => deterministic knowledge-base fallback.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    command: ["npm", "run", "start", "--workspace", "testing-core"]
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bugsafari-prod

  worker:
    # No container_name: a fixed name pins the service to one container and makes
    # replicas/--scale fail. Containers are named bugsafari-prod-worker-N.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *shared-env
      # Stays 1: in-process run state is not isolated (SC1 / CONCURRENCY_BLOCKERS in
      # SafariWorker.ts). Fleet capacity comes from replicas below, where the OS
      # isolates each run's process, browser, and forensic buffers.
      BUGSAFARI_WORKER_CONCURRENCY: ${BUGSAFARI_WORKER_CONCURRENCY:-1}
    command: ["npm", "run", "start:worker", "--workspace", "testing-core"]
    # Concurrent-run capacity == replica count. Budget ~700MB (Node + Chromium) per
    # replica. Scale further: WORKER_REPLICAS=4, or
    # docker compose -f docker-compose.prod.yml up --scale worker=4
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bugsafari-prod

networks:
  bugsafari-prod:
    driver: bridge

volumes:
  redis-data:
