name: bugsafari-prod

x-shared-env: &shared-env
  NODE_ENV: production
  MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
  REDIS_URL: redis://redis:6379
  BUGSAFARI_AUTH_KEY: ${BUGSAFARI_AUTH_KEY:?set BUGSAFARI_AUTH_KEY (32-byte hex or base64)}
  FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
  RUN_ENVIRONMENT: ${RUN_ENVIRONMENT:-CLOUD_HOSTED}
  # AI remediation / insights. Optional by design — an empty key makes the endpoints
  # return the deterministic knowledge-base advice instead of failing the UI.
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
  GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-30000}
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  # Optimize V8 Garbage Collection for 1GB per container budget
  NODE_OPTIONS: "--max-old-space-size=1024"

services:
  redis:
    image: redis:alpine
    container_name: bugsafari-prod-redis
    restart: unless-stopped
    networks:
      - bugsafari-prod
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    container_name: bugsafari-prod-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *shared-env
      PORT: 3000
    command: ["npm", "run", "start", "--workspace", "testing-core"]
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - bugsafari-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:latest
    container_name: bugsafari-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bugsafari-prod
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *shared-env
      BUGSAFARI_WORKER_CONCURRENCY: ${BUGSAFARI_WORKER_CONCURRENCY:-1}
    command: ["npm", "run", "start:worker", "--workspace", "testing-core"]
    networks:
      - bugsafari-prod
    deploy:
      # 2 Worker Replicas == 2 Parallel Test Jobs (Ideal for 2 vCPU / 4GB RAM)
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 1g
    depends_on:
      redis:
        condition: service_healthy

networks:
  bugsafari-prod:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: